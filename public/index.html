<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <!-- Запрет масштабирования — важно для Mini App -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>yourSkills</title>

  <!-- Стили -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Telegram Web App SDK -->
  <!-- Это даёт доступ к window.Telegram.WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ==========================================
       ЭКРАН ЗАГРУЗКИ
       ==========================================
       Показывается пока грузятся данные.
       Исчезает после авторизации.
       ========================================== -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-logo">🎴</div>
    <div class="loading-title">yourSkills</div>
    <div class="loading-subtitle">Загрузка...</div>
    <div class="loading-spinner"></div>
  </div>


  <!-- ==========================================
       ОСНОВНОЕ ПРИЛОЖЕНИЕ
       ==========================================
       Скрыто до авторизации.
       Состоит из навигации + контент.
       ========================================== -->
  <div id="app" class="app hidden">

    <!-- ==========================================
         КОНТЕНТ (меняется роутером)
         ========================================== -->
    <main id="content" class="content">
      <!-- Сюда роутер вставляет страницы -->
    </main>


    <!-- ==========================================
         НИЖНЯЯ НАВИГАЦИЯ (таб-бар)
         ==========================================
         Всегда видна внизу экрана.
         5 вкладок как в мобильных приложениях.
         ========================================== -->
    <nav id="tab-bar" class="tab-bar">

      <button class="tab-item active" data-tab="home" data-link href="/">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Главная</span>
      </button>

      <button class="tab-item" data-tab="search" data-link href="/search">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">Поиск</span>
      </button>

      <button class="tab-item checkin-tab" data-tab="checkin" data-link href="/checkin">
        <span class="tab-icon-large">🔥</span>
      </button>

      <button class="tab-item" data-tab="feed" data-link href="/feed">
        <span class="tab-icon">📢</span>
        <span class="tab-label">Лента</span>
      </button>

      <button class="tab-item" data-tab="settings" data-link href="/settings">
        <span class="tab-icon">⚙️</span>
        <span class="tab-label">Настройки</span>
      </button>

    </nav>
  </div>


  <!-- ==========================================
       МОДАЛЬНОЕ ОКНО (универсальное)
       ==========================================
       Используется для:
       — Добавления навыка
       — Деталей навыка
       — Подтверждений
       — Любых всплывающих окон
       ========================================== -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title"></h3>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Контент модалки вставляется динамически -->
      </div>
    </div>
  </div>


  <!-- ==========================================
       УВЕДОМЛЕНИЕ (toast)
       ==========================================
       Маленькое всплывающее сообщение сверху.
       "Навык добавлен" и т.п.
       ========================================== -->
  <div id="toast" class="toast hidden">
    <span id="toast-icon" class="toast-icon"></span>
    <span id="toast-text" class="toast-text"></span>
  </div>


  <!-- ==========================================
       СКРИПТЫ
       ==========================================
       Порядок важен:
       1. api.js — запросы к серверу
       2. router.js — навигация
       3. Компоненты — отрисовка страниц
       4. app.js — инициализация (последний!)
       ========================================== -->
  <script src="/js/api.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/badgeCatalog.js"></script>
  <script src="/js/skillDays.js"></script>
  <script src="/js/components/card.js"></script>
  <script src="/js/components/skills.js"></script>
  <script src="/js/components/feed.js"></script>
  <script src="/js/components/search.js"></script>
  <script src="/js/components/profile.js"></script>
  <script src="/js/components/checkin.js"></script>
  <script src="/js/components/messages.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
